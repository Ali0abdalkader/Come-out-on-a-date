<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Date Responses Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fde2e4 0%, #f7d6e0 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    h1 {
      color: #c2185b;
      text-align: center;
      margin-bottom: 30px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-box {
      background: linear-gradient(135deg, #c2185b, #e91e63);
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }
    .stat-box h2 {
      font-size: 36px;
      margin: 0;
    }
    .stat-box p {
      margin: 5px 0 0 0;
      font-size: 14px;
    }
    .response {
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      border-left: 5px solid #c2185b;
    }
    .response h3 {
      margin: 0 0 10px 0;
      color: #4a1a2e;
      font-size: 20px;
    }
    .response p {
      margin: 5px 0;
      color: #666;
      font-size: 14px;
    }
    .response strong {
      color: #c2185b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Date Responses Dashboard </h1>
    
    <div class="stats">
      <div class="stat-box">
        <h2 id="totalResponses">0</h2>
        <p>Total Responses</p>
      </div>
      <div class="stat-box">
        <h2 id="yesCount">0</h2>
        <p>Said Yes</p>
      </div>
      <div class="stat-box">
        <h2 id="popularFood">-</h2>
        <p>Popular Food</p>
      </div>
    </div>

    <div id="responsesList"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4p32Zv8zXmkkwY5XcvakJ4oCu3zQPiQ",
      authDomain: "date-responses-7d352.firebaseapp.com",
      projectId: "date-responses-7d352",
      storageBucket: "date-responses-7d352.firebasestorage.app",
      messagingSenderId: "1:5242546167",
      appId: "1:5242546167:web:3d9d5a01e8af854caff0f2",
      measurementId: "G-0Z86Y603VD"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection('responses').orderBy('timestamp', 'desc').get().then((snapshot) => {
      const responses = [];
      snapshot.forEach((doc) => {
        responses.push(doc.data());
      });

      document.getElementById('totalResponses').textContent = responses.length;
      document.getElementById('yesCount').textContent = responses.length;

      const foodCounts = {};
      responses.forEach(r => {
        if (r.food) foodCounts[r.food] = (foodCounts[r.food] || 0) + 1;
      });
      
      let popularFood = '-';
      if (Object.keys(foodCounts).length > 0) {
        popularFood = Object.keys(foodCounts).reduce((a, b) => foodCounts[a] > foodCounts[b] ? a : b);
      }
      document.getElementById('popularFood').textContent = popularFood;

      if (responses.length === 0) {
        document.getElementById('responsesList').innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">No responses yet 💔</p>';
      } else {
        document.getElementById('responsesList').innerHTML = responses.map((r, index) => `
          <div class="response">
            <h3>💖 Response #${index + 1}</h3>
            <p><strong>📅 Date:</strong> ${r.date || 'N/A'}</p>
            <p><strong> Time:</strong> ${r.time || 'N/A'}</p>
            <p><strong>📍 Plan:</strong> ${r.plan || 'N/A'}</p>
            <p><strong>🍽️ Food:</strong> ${r.food || 'N/A'}</p>
          </div>
        `).join('');
      }
    }).catch((error) => {
      console.error('Error:', error);
      document.getElementById('responsesList').innerHTML = '<p style="text-align: center; color: red;">Error: ' + error.message + '</p>';
    });
  </script>
</body>
</html>
